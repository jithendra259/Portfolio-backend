name: keep-render-awake

# Fires every 5 minutes to keep Render free-tier web service awake.
# Render sleeps after 15 min of inactivity; 5-min pings provide a 10-min buffer.
# NOTE: GitHub Actions may delay scheduled runs by up to ~10 min,
# so also set up https://cron-job.org for guaranteed timing.

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 min — stays well within Render free-tier's 15-min sleep threshold
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "${{ secrets.RENDER_HEALTH_URL }}" || echo "000")
          echo "Health check responded with HTTP $STATUS"
          if [ "$STATUS" != "000" ] && [ "$STATUS" -lt 500 ]; then
            echo "Service is awake or waking up."
            exit 0
          else
            echo "Health check failed or returned server error."
            exit 1
          fi
